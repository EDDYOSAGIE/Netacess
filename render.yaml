databases:
  - name: netacess-demo-db
    databaseName: netacess
    user: netacess
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: netacess-demo-api
    runtime: python
    rootDir: backend
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    preDeployCommand: python manage.py migrate && python manage.py createcachetable
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_TRUST_X_FORWARDED_PROTO
        value: "true"
      - key: DEPLOYMENT_STAGE
        value: demo
      - key: DATABASE_URL
        fromDatabase:
          name: netacess-demo-db
          property: connectionString
      - key: USE_REDIS
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_PHONE_ALLOWLIST
        sync: false
      - key: SMS_PROVIDER
        value: console
      - key: ACCESS_CODE_ENC_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_HASH
        sync: false
      - key: FRONTEND_URL
        sync: false